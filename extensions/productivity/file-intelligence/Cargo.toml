[package]
name = "lmlmxtend-file-intelligence"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Seriki Walter Yakub"]
description = "Local-first file study, safe organization, and document merging for LMLMxtend"

[dependencies]
lmlmxtend-api = { path = "../../../crates/lmlmxtend-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
lopdf = "0.47"
docx-rs = { version = "0.4.22", default-features = false }
calamine = "0.26"
rust_xlsxwriter = "0.79"
# Keep Calamine on the pre-generic ZipFile API it targets.
zip = "=2.2.2"

[dev-dependencies]
tempfile = "3"

[workspace]
