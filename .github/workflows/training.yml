name: LMLM training tests

on:
  pull_request:
    paths:
      - "model_training/lmlm_training/**"
      - "tests/test_lmlm_training.py"
      - ".github/workflows/training.yml"
  push:
    branches: [main]
    paths:
      - "model_training/lmlm_training/**"
      - "tests/test_lmlm_training.py"
      - ".github/workflows/training.yml"

jobs:
  training-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Run LMLM training tests
        run: python -m pytest -q tests/test_lmlm_training.py
      - name: Compile training package
        run: python -m compileall -q model_training/lmlm_training
