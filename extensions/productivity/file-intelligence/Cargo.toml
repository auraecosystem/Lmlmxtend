[package]
name = "lmlmxtend-file-intelligence"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Seriki Walter Yakub"]
description = "Local-first file study, safe organization, and text merging for LMLMxtend"

[dependencies]
lmlmxtend-api = { path = "../../../crates/lmlmxtend-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[workspace]
