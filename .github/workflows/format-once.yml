name: One-time Rust formatting
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-once.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatted Rust sources
        run: |
          if git diff --quiet; then
            echo "Rust sources already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style(rust): format workspace with rustfmt"
          git push
